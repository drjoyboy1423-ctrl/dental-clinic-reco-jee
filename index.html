<script>/* Ethiopian calendar: conversion, display mode (EC / GC / both) and date entry fields. */
const EC_M=['መስከረም','ጥቅምት','ኅዳር','ታኅሣሥ','ጥር','የካቲት','መጋቢት','ሚያዝያ','ግንቦት','ሰኔ','ሐምሌ','ነሐሴ','ጳጉሜ'];
const EC_L=['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'];
const EC_OFF=1723856;
const gJDN=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)+2440588;
function toEC(d){const j=gJDN(d),r=(j-EC_OFF)%1461,n=r%365+365*Math.floor(r/1460);return {y:4*Math.floor((j-EC_OFF)/1461)+Math.floor(r/365)-Math.floor(r/1460),m:Math.floor(n/30)+1,d:n%30+1}}
function fromEC(y,m,d){const j=EC_OFF+365+365*(y-1)+Math.floor(y/4)+30*m+d-31,u=(j-2440588)*864e5,x=new Date(u);return new Date(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate())}
const ecLeap=y=>y%4==3,ecDays=(y,m)=>m<13?30:(ecLeap(y)?6:5);
const pad2=n=>String(n).padStart(2,'0');
const isoD=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
function toDate(t){if(t==null||t==='')return null;if(t instanceof Date)return isNaN(t)?null:t;if(typeof t=='number')return new Date(t);const s=String(t);if(ISO_RE.test(s))return new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));const v=Date.parse(s);return isNaN(v)?null:new Date(v)}
const toISO=t=>{const d=toDate(t);return d?isoD(d):''};
const CAL_KEY='dental_calendar';
let CALM_=(()=>{try{const v=localStorage.getItem(CAL_KEY);return ['ec','gc','both'].includes(v)?v:'ec'}catch(e){return 'ec'}})();
const CALM=()=>CALM_;
const gcStr=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const ecStr=d=>{const e=toEC(d);return EC_M[e.m-1]+' '+e.d+', '+e.y};
function fdate(t,mode){const d=toDate(t);if(!d)return (t==null||t==='')?'-':String(t);mode=mode||CALM_;return mode=='gc'?gcStr(d):mode=='ec'?ecStr(d):ecStr(d)+' ('+gcStr(d)+')'}
function fshort(t){const d=toDate(t);if(!d)return '';if(CALM_=='gc')return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});const e=toEC(d);return EC_M[e.m-1]+' '+e.d}
const dsp=x=>ISO_RE.test(x.date||'')?fdate(x.date):fdate(x.ts||x.date);
const calLabel=()=>CALM_=='ec'?'EC':CALM_=='gc'?'GC':'EC + GC';
function cycleCal(){CALM_=CALM_=='ec'?'gc':CALM_=='gc'?'both':'ec';try{localStorage.setItem(CAL_KEY,CALM_)}catch(e){}calBtn();if(typeof go=='function'&&typeof U!='undefined'&&U&&document.getElementById('md').classList.contains('hidden'))go(V)}
function calBtn(){const b=document.getElementById('calbtn');if(b)b.textContent='Calendar: '+calLabel()}

/* date entry: Ethiopian selects (EC mode) or a native date input (GC / both). The value is always an ISO yyyy-mm-dd string in #id. */
function dateField(id,val,cb){cb=cb||'';const iso=toISO(val),mode=CALM_;
 if(mode=='ec'){const base=iso?toDate(iso):new Date(),e=toEC(base),cy=toEC(new Date()).y,ys=[];for(let y=cy-100;y<=cy+5;y++)ys.push(y);
  const v=iso||isoD(base);
  return `<div class="grid grid-cols-3 gap-2 mb-3"><select id="${id}_d" onchange="ecSync('${id}');${cb}" class="inp" aria-label="Day">${Array.from({length:30},(_,i)=>`<option ${i+1==e.d?'selected':''}>${i+1}</option>`).join('')}</select><select id="${id}_m" onchange="ecSync('${id}');${cb}" class="inp" aria-label="Month">${EC_M.map((n,i)=>`<option value="${i+1}" ${i+1==e.m?'selected':''}>${n}</option>`).join('')}</select><select id="${id}_y" onchange="ecSync('${id}');${cb}" class="inp" aria-label="Year">${ys.map(y=>`<option ${y==e.y?'selected':''}>${y}</option>`).join('')}</select><input type="hidden" id="${id}" value="${v}"></div><div id="${id}_h" class="text-xs text-gray-500 -mt-2 mb-3">${gcStr(base)}</div>`}
 return `<input id="${id}" type="date" value="${iso}" onchange="ecHint('${id}');${cb}" class="inp mb-3">`+(mode=='both'?`<div id="${id}_h" class="text-xs text-gray-500 -mt-2 mb-3">${iso?ecStr(toDate(iso)):''}</div>`:'')}
function ecSync(id){const y=+document.getElementById(id+'_y').value,m=+document.getElementById(id+'_m').value;let d=+document.getElementById(id+'_d').value;const max=ecDays(y,m);if(d>max){d=max;document.getElementById(id+'_d').value=d}const g=fromEC(y,m,d);document.getElementById(id).value=isoD(g);const h=document.getElementById(id+'_h');if(h)h.textContent=gcStr(g)}
function ecHint(id){const h=document.getElementById(id+'_h'),v=document.getElementById(id).value;if(h)h.textContent=v?ecStr(toDate(v)):''}

/* payment platforms */
const PAYM=['Cash','Telebirr','CBE Birr','CBE (bank)','eBirr','Other bank','Card'];
</script>

const cInfo=()=>CLINIC_INFO[C.id]||{am:'',phone:'',addr:''};
const cLetterhead=(am,en)=>{const i=cInfo();return `<div class="cl-h"><div class="lgo">${C.logo?`<img src="${C.logo}">`:`<svg viewBox="0 0 100 100">${ICONS[C.icon]||ICONS.tooth}</svg>`}</div><div class="cl-hn">${i.am?`<div class="cl-am">${H(i.am)}</div>`:''}<div class="cl-en">${H(C.name)}</div>${i.phone?`<div class="cl-ph">&#9742; ${H(i.phone)}</div>`:''}</div></div>${am?`<div class="cl-badge"><b>${am}</b><br>${en}</div>`:''}`};
const CL_CSS=`<style>body{font-family:'Noto Sans Ethiopic','Nyala','Abyssinica SIL','Kefa',Arial,sans-serif;font-size:12.5px;line-height:1.4}.cl-h{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:6px}.cl-hn{text-align:left}.cl-am{font-size:20px;font-weight:bold}.cl-en{font-size:18px;font-weight:bold}.cl-ph{font-size:13px;letter-spacing:1px;margin-top:2px}.cl-badge{width:60%;margin:8px auto 10px;border:2px dashed #444;border-radius:16px;text-align:center;padding:5px;font-size:15px}.cl-row{display:flex;gap:6px;align-items:flex-end;margin:8px 0}.cl-l{white-space:nowrap}.cl-v{flex:1;border-bottom:1px solid #333;min-height:18px;padding:0 4px}.cl-top{display:flex;gap:18px;margin-top:10px}.cl-top>div{flex:1}.cl-hx{font-size:11.5px}.cl-hx div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.cl-bx{display:inline-block;width:13px;height:13px;border:1.5px solid #222;text-align:center;line-height:11px;font-size:12px;font-weight:bold;flex:none}table.cl-t{width:100%;border-collapse:collapse;margin-top:12px;border:1.5px solid #222}table.cl-t th{background:#fff;color:#111;text-align:left;border:1px solid #222;padding:4px 6px;font-size:11.5px}table.cl-t td{border:1px solid #444;padding:5px 6px;font-size:11px;height:26px;vertical-align:top}.tg{display:inline-block;font-size:10px;font-weight:bold;border:1px solid #555;border-radius:4px;padding:0 4px;margin-right:4px;white-space:nowrap}.cl-line{border-bottom:1px solid #333;height:24px;margin:2px 0}.cl-sec{margin-top:14px;font-size:13.5px}.cl-sig{display:flex;gap:30px;margin-top:34px}.cl-sig>div{flex:1;border-top:1px solid #333;text-align:center;padding-top:3px}.cl-foot{margin-top:26px;font-weight:bold;font-size:14px}</style>`;
const clRow=(am,en,val,w)=>`<div class="cl-row"><span class="cl-l">${am?am+' / ':''}${en}:</span><span class="cl-v" style="${w?'flex:none;width:'+w:''}">${val==null||val===''?'&nbsp;':H(val)}</span></div>`;

/* ---- patient clinical summary card (Hx, medications, investigations, referral, biopsy, consent) ---- */
const HXLIST=[['ደም ግፊት','Hypertension',['Hypertension']],['ስኳር በሽታ','Diabetes',['Diabetes Mellitus']],['የደም መፍሰስ ችግር','Bleeding disorder',['Bleeding Disorder','Coagulopathy']],['የሳንባ በሽታ','TB / pneumonia',[],/\btb\b|pneumonia|tuberc/i],['የሚጥ በሽታ','Epilepsy',['Epilepsy']],['የጉበት በሽታ','Hepatitis A, B, C',[],/hepat/i],['ኤችአይቪ/ኤድስ','HIV/AIDS CD4',['Immune Deficiency'],/\bhiv\b|aids/i],['የሚወስደው መድሃኒት ካለ','Any drug taking',['Medications Taken']],['አለርጂ','Allergy',['Allergies']],['እርግዝና (ለሴቶች)','Pregnancy',['Pregnancy']],['ሌላ በሽታ ካለ','Any other disease',['Anemia','Asthma','Heart Disease','Organopathy']]];
function clinicalItems(p){const d=p.d,L=[],add=(x,o)=>{if(Object.values(o).some(v=>v&&String(v).trim()))L.push(Object.assign({ts:tsOf(x,p),cc:'',ex:'',dx:'',plan:'',done:''},o))},j=(...a)=>a.filter(v=>v!=null&&String(v).trim()!=='').join(' - ');
 (d.health||[]).forEach(x=>add(x,{cc:x.note,ex:j(x.bp&&'BP '+x.bp,x.allergy&&'Allergy: '+x.allergy)}));
 (d.note||[]).forEach(x=>add(x,{cc:j(x.title,x.note)}));
 (d.rec||[]).forEach(x=>add(x,{ex:j(x.tooth&&'Tooth '+x.tooth,x.note),dx:x.finding,done:x.treat}));
 (d.ortho||[]).forEach(x=>add(x,{plan:j('Ortho',x.type,x.note)}));
 (d.presc||[]).forEach(x=>add(x,{dx:x.dx,plan:j('Rx: '+(x.meds||[]).join(', '),x.txt)}));
 (d.lab||[]).forEach(x=>add(x,{ex:j('Lab: '+(x.req||''),x.lab&&'('+x.lab+')',x.done=='Yes'?'done':'ordered')}));
 (d.img||[]).forEach(x=>add(x,{ex:j('X-ray: '+(x.kind||''),x.tooth&&'Tooth/Area '+x.tooth,x.note)}));
 (d.ref||[]).forEach(x=>add(x,{done:j('Referral',x.to&&'to '+x.to,x.why)}));
 (d.fna||[]).forEach(x=>add(x,{plan:j(x.type=='Biopsy'?'Biopsy':'FNA',x.site,x.note)}));
 return L.sort((a,b)=>a.ts-b.ts)}
function clinicalSummaryHtml(p){const c=p.d.consent||{ck:[],o:'',t:''},ck=new Set(c.ck||[]),txt=(c.o||'')+' '+((p.d.health||[]).map(x=>x.allergy||'').join(' ')),items=clinicalItems(p),
 on=h=>h[2].some(n=>ck.has(n))||(h[3]&&h[3].test(txt))||(h[1]=='Allergy'&&(p.d.health||[]).some(x=>x.allergy)),
 hx=HXLIST.map(h=>`<div><span>${h[0]} /${h[1]}/</span><span class="cl-bx">${on(h)?'&#10003;':''}</span></div>`).join(''),
 other=[...ck].filter(n=>['Anemia','Asthma','Heart Disease','Organopathy'].includes(n)).join(', '),
 rows=items.map(x=>`<tr><td style="white-space:nowrap">${H(fdate(x.ts))}</td><td>${H(x.cc)}</td><td>${H(x.ex)}</td><td>${H(x.dx)}</td><td>${H(x.plan)}</td><td>${H(x.done)}</td></tr>`).join('')+Array(Math.max(0,8-items.length)).fill('<tr>'+'<td>&nbsp;</td>'.repeat(6)+'</tr>').join('');
 return CL_CSS+cLetterhead('','')+`<div class="cl-top"><div>${clRow('የካርድ ቁጥር','Card No',p.card)}${clRow('ቀን','Date',fdate(p.date||Date.now()))}${clRow('ስም','Patient\'s Name',p.name)}${clRow('አድራሻ','Address','')}${clRow('ስልክ ቁጥር','Tel. No',p.phone)}${clRow('ዕድሜ / ፆታ','Age / Sex',(p.age||'')+(p.sex?' / '+p.sex:''))}${clRow('','Relative name','')}${clRow('','Relative Tel. No','')}</div>
  <div class="cl-hx"><div style="justify-content:flex-start"><b>የታካሚው ጤንነት ሁኔታ /Medical History/</b></div>${hx}${other?`<div class="muted" style="font-size:10.5px">Other: ${H(other)}${c.o?' &middot; '+H(c.o):''}</div>`:c.o?`<div style="font-size:10.5px">Other: ${H(c.o)}</div>`:''}</div></div>
  <table class="cl-t"><tr><th colspan="6">Clinical History</th></tr><tr><th style="width:11%">Date</th><th style="width:17%">C/c</th><th style="width:22%">Examination / Investigation</th><th style="width:16%">Dx</th><th style="width:19%">Rx plan</th><th style="width:15%">Rx done</th></tr>${rows}</table>
  <div class="cl-sec"><b>ፈቃድ / Consent:</b> ${c.t?H(c.t)+'. ':''}የተገለጸልኝን ሕክምና ለማድረግ ፈቃደኛ ነኝ። / I agree to the treatment explained to me.</div>
  <div class="cl-sig"><div>የታካሚ ፊርማ / Patient signature</div><div>ሐኪም ፊርማ / Doctor signature</div><div>ቀን / Date</div></div>`}
function clinicalSummaryPrint(id){const p=id!=null?S.patients.find(x=>x.id==id):gp();if(!p)return;printHtml('Clinical summary - '+p.name,clinicalSummaryHtml(p))}

/* ---- medical certificate (paper layout) ---- */
function medCertHtml(p,x){x=x||{};const lines=(t,n)=>{const a=String(t||'').split('\n').filter(Boolean);return Array.from({length:Math.max(n,a.length)},(_,i)=>`<div class="cl-line">${H(a[i]||'')}</div>`).join('')},
 dd=toDate(x.date),ret=dd&&+x.days>0?fdate(new Date(dd.getTime()+(+x.days)*864e5)):'';
 return CL_CSS+cLetterhead('የሀክምና የምስክር ወረቀት','Medical Certificate')+
  clRow('','Patient\'s Full Name',p&&p.name)+`<div style="display:flex;gap:14px">${clRow('','Sex',p&&p.sex)}${clRow('','Age',p&&p.age)}${clRow('','Address','')}</div>`+
  `<div class="cl-sec"><b>የታከመበት ቦታ / Examined / Treated on</b></div><div class="cl-line">${H(p?C.name:'')}</div>`+
  `<div class="cl-sec"><b>የህመማቸው ዓይነት / Diagnosis</b></div>${lines(x.dx,3)}`+
  `<div class="cl-sec"><b>የሀኪም ትዛዝ / Doctor's Recommendation</b></div>${lines(x.rec,3)}`+
  clRow('የተፈቀደላቸው ዕረፍት','Rest days granted',x.days?x.days+' day(s)':'')+clRow('ወደ ስራ የሚመለሱበት ቀን','Return to work date',ret)+
  `<div class="cl-sig" style="margin-top:34px"><div>Dr.'s Signature</div><div>Date${x.date?': '+H(fdate(x.date)):''}</div></div>`+
  (cInfo().addr?`<div class="cl-foot">${H(cInfo().addr)}</div>`:'')}
function medCert(i){const p=gp();if(!p)return;const a=p.d.cert||[],x=i=='blank'?null:a[i!=null?i:a.length-1];printHtml('Medical certificate'+(x?' - '+p.name:''),medCertHtml(x?p:null,x||{}))}
/* ---------- sample data ---------- */
function seedPatients(start){let sd=11;const R=()=>(sd=sd*16807%2147483647)/2147483647,pk=a=>a[Math.floor(R()*a.length)],t=NOW(),t0=sod(t),base=t,out=[];
 const N=[['Abebe Kebede','Male',34],['Tigist Alemu','Female',28],['Dawit Haile','Male',41],['Selamawit Tesfaye','Female',36],['Mulugeta Bekele','Male',52],['Hanna Girma','Female',19],['Yonas Assefa','Male',25],['Meron Tadesse','Female',31],['Biruk Solomon','Male',9],['Rahel Desta','Female',45],['Kidus Negash','Male',29],['Saron Mekonnen','Female',23],['Fikru Wolde','Male',61],['Liya Abera','Female',15],['Henok Getachew','Male',38],['Bethlehem Yilma','Female',33]];
 const docs=['Dr. Ebsa Tofik Abdulkariim'],lbs=['Addis Dental Lab','Smile Ceramics Lab'];
 N.forEach((n,k)=>{const reg=t-Math.floor(R()*75)*DAY-Math.floor(R()*8)*36e5,arr=k<5?Math.max(t0+k*6e4,t-(k+1)*2700000):reg,p={id:base+k,card:(start||1)+k,name:n[0],sex:n[1],age:n[2],phone:'+2519'+String(10000000+Math.floor(R()*89999999)),dob:String(new Date().getFullYear()-n[2]),branch:C.name,doc:docs[0],doctor:docs[0],date:Math.min(reg,arr),arr,st:k<5?['new','doctor','nurse','new','doctor'][k]:'doctor',fin:k>=5&&R()<.6,d:{},demo:true};
  p.cardNo=p.card;const D=p.d,dt=x=>isoD(x),pm=()=>{const m=pk(['Cash','Cash','Telebirr','CBE Birr','eBirr','CBE (bank)']);return {method:m,ref:m=='Cash'?'':m.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()+String(1e9+Math.floor(R()*9e8)).slice(1)}};
  D.rec=[{tooth:String(1+Math.floor(R()*32)),finding:pk(DIS),treat:pk(PRO)[0],note:'',date:dt(p.date),by:docs[0],ts:p.date}];
  const ni=1+Math.floor(R()*3);D.inv=[];for(let j=0;j<ni;j++){const pro=pk(PRO),qty=pro[0]=='Extraction'?1+Math.floor(R()*2):1,disc=R()<.25?100:0,total=pro[1]*qty-disc,ts=Math.min(t-6e4,p.date+R()*(t-p.date)),m=R(),paid=m<.5?total:m<.8?Math.round(total*(.4+R()*.2)/10)*10:0,pays=[];
   if(paid>0){if(paid==total&&total>1500&&R()<.4){const a=Math.round(total/2);pays.push({ts,amt:a,by:'Reception',method:'Cash'},{ts:Math.min(t,ts+2*DAY),amt:total-a,by:'Reception',method:pk(['Cash','Mobile money'])})}else pays.push({ts,amt:paid,by:'Reception',method:pk(['Cash','Mobile money','Bank transfer'])})}
   pays.forEach(y=>Object.assign(y,pm()));D.inv.push({item:pro[0],desc:'',price:pro[1],qty,disc,paid,pays,date:dt(ts),ts,by:'Reception'})}
  if(R()<.45){const pro=pk(PRO);D.prof=[{item:pro[0],desc:'Estimate',price:pro[1],qty:1,disc:0,date:dt(p.date),ts:p.date,by:'Reception'}]}
  D.appt=[];if(k%2==0||k==3){const off=k==2||k==3?0:1+Math.floor(R()*9);D.appt.push({date:isoD(t0+off*DAY+12*36e5),time:pk(['09:00','10:30','14:00','15:30','16:45']),note:pk(['Follow-up check','Scaling session','Root canal visit 2','Crown fitting','Extraction review']),date0:1,ts:t})}
  if(k%5==1)D.appt.push({date:isoD(t0-(3+k)*DAY),time:'11:00',note:'Initial consultation',ts:t});
  if(k%4==1)D.lab=[{req:pk(['Zirconia crown','Partial denture','Night guard']),lab:pk(lbs),done:k%8==1?'Yes':'No',date:dt(p.date),by:docs[0],ts:p.date}];
  if(k==3||k==10)D.cred=[{amt:500,note:'Advance payment',date:dt(p.date),by:'Reception',ts:p.date}];
  if(k%5==0)D.note=[{title:'Allergy check',note:'Confirmed no known drug allergies.',date:dt(p.date),by:docs[0],ts:p.date}];
  D.appt.forEach(a=>delete a.date0);out.push(p)});return out}
function addDemo(){if(!canAdd())return alert('Only Reception and Manager can add records.');S.patients.push(...seedPatients(nextCard()));ensureInvNos();sv();go('rpr')}
function rmDemo(){const n=S.patients.filter(p=>p.demo).length;if(n&&confirm('Remove '+n+' sample patients and all their records?')){S.patients=S.patients.filter(p=>!p.demo);sv();go('rpr')}}
